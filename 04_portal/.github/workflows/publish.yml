name: Publish App Release

on:
  workflow_call:
    inputs:
      version:
        description: App version
        required: true
        type: string

      tag:
        description: Git tag
        required: true
        type: string

      prerelease:
        description: Is prerelease
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Sakshi Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate App Version
        run: |
          VERSION=$(grep '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts \
            | sed -E 's/.*=[[:space:]]*"([^"]*)".*/\1/' \
            | head -n 1)

          echo "Build version : $VERSION"
          echo "Input version : ${{ inputs.version }}"

          if [ "$VERSION" != "${{ inputs.version }}" ]; then
            echo "Version mismatch."
            exit_code=1
            sh -c "exit $exit_code"
          fi

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build Release Artifacts
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew check assembleRelease
          for apk in app/build/outputs/apk/release/*.apk; do
            if [[ -f "$apk" ]]; then
              mv "$apk" "app/build/outputs/apk/release/Sakshi-Portal.apk"
            fi
          done

      - name: Clean up Keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Determine Previous Tag
        id: prev_tag
        run: |
          git fetch --tags
          if [ "${{ inputs.prerelease }}" == "true" ]; then
            PREV=$(git tag --sort=-v:refname | grep -E '^portal-.*' | head -n 1 || true)
          else
            PREV=$(git tag --sort=-v:refname | grep -E '^portal-.*' | grep -iE -v '-(alpha|beta|rc|snapshot|dev|preview|milestone|m[0-9]+)([.-][0-9]+)?$' | head -n 1 || true)
          fi
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"

      # Create Git Tag
      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          previous_tag: ${{ steps.prev_tag.outputs.prev_tag }}
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: ${{ inputs.prerelease == 'true' }}
          generate_release_notes: true
