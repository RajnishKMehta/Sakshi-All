name: PR Validation

on:
  # Run on pull requests targeting main
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "**/*.adoc"
      - "**/*.txt"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - ".gitattributes"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

  # Allow manual runs
  workflow_dispatch:

# Cancel older validation runs for the same PR
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR & Build
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Install Java
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Configure Gradle and enable caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        
      # Validate and build release AAR
      - name: Validate PR & Build
        run: ./gradlew :sakshi-sdk:check :sakshi-sdk:assembleRelease
