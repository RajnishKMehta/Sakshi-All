name: Build application

on:
  workflow_dispatch: 
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x 01_sdk/gradlew 02_vault/gradlew 03_camera/gradlew

      - name: Build SDK
        run: cd 01_sdk && ./gradlew assembleDebug --no-daemon

      - name: Build Vault
        run: cd 02_vault && ./gradlew assembleDebug --no-daemon

      - name: Build Camera
        run: cd 03_camera && ./gradlew assembleDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: "**/build/outputs/apk/**/*.apk"
