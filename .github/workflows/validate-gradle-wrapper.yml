name: Validate Gradle Wrapper

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validation:
    name: "Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
           persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
