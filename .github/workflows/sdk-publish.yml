name: Publish SDK Release

on:
  workflow_call:
    inputs:
      version:
        description: SDK version
        required: true
        type: string

      tag:
        description: Git tag
        required: true
        type: string

      prerelease:
        description: Is prerelease
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Sakshi SDK
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Install Java
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Configure Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Validate SDK version
      - name: Validate SDK Version
        run: |
          VERSION=$(grep '^sakshi-sdk *= *"' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')

          if [ "$VERSION" != "${{ inputs.version }}" ]; then
            echo "Version mismatch."
            echo "Expected : $VERSION"
            echo "Received : ${{ inputs.version }}"
            exit 1
          fi

      # Create Git Tag
      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions.noreply.github.com"

          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"

      # Build SDK
      - name: Build Release Artifacts
        run: |
          ./gradlew \
            :sakshi-sdk:check \
            :sakshi-sdk:assembleRelease

      # Publish
      - name: Publish to GitHub Packages & Maven Central
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./gradlew \
            :sakshi-sdk:publishAllPublicationsToGithubPackagesRepository \
            :sakshi-sdk:publishAndReleaseToMavenCentral

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            sakshi-sdk/build/outputs/aar/sakshi-sdk-release.aar
          draft: false
          prerelease: ${{ inputs.prerelease == 'true' }}
          generate_release_notes: true
