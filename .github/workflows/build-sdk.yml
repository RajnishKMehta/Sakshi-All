name: Build SDK

on:
  workflow_dispatch: 
  push:
    branches: main
  pull_request:

permissions:
 contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x 01_sdk/gradlew

      - name: Build SDK
        run: cd 01_sdk && ./gradlew :sakshi-sdk:check :sakshi-sdk:assembleRelease

      - name: Upload AARs
        uses: actions/upload-artifact@v7
        with:
          name: AARs
          path: "**/*.aar"
          if-no-files-found: error
