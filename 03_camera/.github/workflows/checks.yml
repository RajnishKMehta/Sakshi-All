name: Checks

on:
    pull_request:
        paths-ignore:
            - "**/*.md"
            - "**/*.adoc"
            - "docs/**"
            - "README*"
            - "LICENSE"
            - ".gitignore"

    push:
        branches:
            - main
        paths-ignore:
            - "**/*.md"
            - "**/*.adoc"
            - "docs/**"
            - "README*"
            - "LICENSE"
            - ".gitignore"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_number }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint-and-test:
        name: Lint & Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Java 21
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Run Checks (Lint & Test)
              run: ./gradlew check
